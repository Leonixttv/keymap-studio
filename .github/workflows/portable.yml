name: Portable builds
on:
  push:
    branches: [international]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
            architecture: x64
            platform: windows
          - name: macos-arm64
            runner: macos-15-intel
            architecture: arm64
            platform: macos
          - name: macos-x64
            runner: macos-15-intel
            architecture: x64
            platform: macos
          - name: linux-x64
            runner: ubuntu-24.04
            architecture: x64
            platform: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check application scripts
        run: npm run check
      - name: Test layer safety
        run: npm test
      - name: Build portable EXE
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          npm run build:portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist/Keymap-Studio-Portable.exe dist/Keymap-Studio-0.6.2-Windows-x64.exe
      - name: Build macOS app archive
        if: matrix.platform == 'macos'
        run: npm run build:mac -- --${{ matrix.architecture }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Linux portable archive
        if: matrix.platform == 'linux'
        run: npm run build:linux -- --x64
      - uses: actions/upload-artifact@v4
        with:
          name: keymap-${{ matrix.name }}
          path: |
            dist/Keymap-Studio-0.6.2-*.exe
            dist/Keymap-Studio-0.6.2-*.zip
            dist/Keymap-Studio-0.6.2-*.tar.gz
          if-no-files-found: error
